<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">JapanDino — Machine learning and software</title>
  <desc id="desc">Minimal editorial composition: warm ivory, charcoal typography, a muted terracotta circle and fine orbital lines.</desc>
  <defs>
